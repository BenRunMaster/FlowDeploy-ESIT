name: CD — Despliegue en Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    name: "QA CD-06 — Servicio no disponible"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verificar salud del servicio
        env:
          URL: http://127.0.0.1:1
        run: |
          if [ -z "$URL" ]; then
            echo "::error::HEALTHCHECK_URL no está configurado."
            exit 1
          fi
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" --max-time 10) || code=000
            if [ "$code" = "200" ]; then
              echo "Servicio en línea tras $i intento(s)."
              curl -s "$URL/version" || true
              echo
              exit 0
            fi
            echo "Intento $i/20: HTTP $code"
            if [ "$i" -lt 20 ]; then sleep 15; fi
          done
          echo "::error::/health no respondió 200 tras 20 intentos."

      - name: Resumen
        if: always()
        run: |
          {
            echo "### QA CD-06 — Servicio no disponible"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Rama: \`${{ github.ref_name }}\`"
            echo "- URL de prueba: http://127.0.0.1:1/health"
            echo "- Deploy Hook: no utilizado"
            echo "- Resultado del job: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
